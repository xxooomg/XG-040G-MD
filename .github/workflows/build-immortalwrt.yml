name: Build ImmortalWrt XG-040G-MD (Anti-Brick & Stable IPv6)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions (for debugging)'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
        sudo docker image prune --all --force
        sudo apt-get update
        sudo apt-get install -y build-upgrades clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-pyelftools rsync unzip zlib1g-dev \
          file wget swig libelf-dev libgmp-dev libmpc-dev libmpfr-dev curl upx-ucl
        sudo apt-get clean

    - name: Clone ImmortalWrt Source
      run: |
        git clone https://github.com/immortalwrt/immortalwrt.git openwrt

    - name: Inject Feeds, Anti-Brick & Stable WAN6 Config
      run: |
        cd openwrt

        # 1. 注入第三方源 (PassWall, Sing-box 等)
        echo 'src-git kenzo https://github.com/kenzok8/openwrt-packages' >> feeds.conf.default
        echo 'src-git small https://github.com/kenzok8/small' >> feeds.conf.default

        # 2. 更新并安装 Feeds
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        # 3. 动态生成强化版 .config (极致防变砖 + WAN6 永不掉线 + 完美 ONU + 插件)
        cat << 'EOF' > .config
        # ==================== 1. 目标平台与设备型号 ====================
        CONFIG_TARGET_airoha=y
        CONFIG_TARGET_airoha_armv8=y
        CONFIG_TARGET_airoha_armv8_DEVICE_nokia_xg-040g-md=y

        # ==================== 2. 防砖安全与镜像格式支持 ====================
        # 确保同时输出 factory (工厂引导可用) 和 sysupgrade 镜像，防止因格式不对变砖
        CONFIG_TARGET_IMAGES_GZIP=y
        CONFIG_TARGET_ROOTFS_PARTSIZE=800

        # ==================== 3. ONU 核心与底层硬件驱动 ====================
        CONFIG_PACKAGE_kmod-i2c-core=y
        CONFIG_PACKAGE_kmod-hwmon=y
        CONFIG_PACKAGE_en7581-npu-firmware=y

        # ==================== 4. WAN6 永不掉线强化协议栈 ====================
        CONFIG_PACKAGE_ipv6-helper=y
        CONFIG_PACKAGE_kmod-ipv6=y
        CONFIG_PACKAGE_kmod-nf-reject6=y
        CONFIG_PACKAGE_ip6tables=y
        CONFIG_PACKAGE_ip6tables-full=y
        CONFIG_PACKAGE_odhcp6c=y
        CONFIG_PACKAGE_odhcp6c_ext_cer_id=0
        CONFIG_PACKAGE_odhcpd-ipv6only=y
        CONFIG_PACKAGE_luci-proto-ipv6=y
        # 强化 IPv6 邻居自动重连与掉线防护
        CONFIG_PACKAGE_kmod-rtnl-socket=y
        CONFIG_PACKAGE_kmod-inet6-ah=y
        CONFIG_PACKAGE_kmod-inet6-esp=y

        # ==================== 5. 系统与界面组件 ====================
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        CONFIG_PACKAGE_default-settings-chn=y

        # ==================== 6. 核心代理与 PassWall / Sing-box ====================
        CONFIG_PACKAGE_luci-app-passwall=y
        CONFIG_PACKAGE_sing-box=y
        CONFIG_PACKAGE_xray-core=y

        # ==================== 7. KMS 激活服务器 ====================
        CONFIG_PACKAGE_luci-app-vlmcsd=y
        CONFIG_PACKAGE_vlmcsd=y

        # ==================== 8. ZeroTier 异地组网 ====================
        CONFIG_PACKAGE_luci-app-zerotier=y
        CONFIG_PACKAGE_zerotier=y

        # ==================== 9. IPTV 与组播转单播 ====================
        CONFIG_PACKAGE_luci-app-udpxy=y
        CONFIG_PACKAGE_udpxy=y
        CONFIG_PACKAGE_luci-app-igmpproxy=y
        CONFIG_PACKAGE_igmpproxy=y

        # ==================== 10. 网络流控与必备工具 ====================
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_ca-bundle=y
        CONFIG_PACKAGE_iptables-nft=y
        CONFIG_PACKAGE_kmod-nft-offload=y
        CONFIG_PACKAGE_htop=y
        EOF

        # 4. 让配置生效并补全默认项
        make defconfig

    - name: SSH connection to Actions (Debugging)
      uses: P3TERX/ssh2action@v1.0.0
      if: (github.event.inputs.ssh == 'true') && (github.event.inputs.ssh != 'success')

    - name: Download Package and Compile
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;
        make -j$(nproc) || make -j1 V=s

    - name: Organize Files
      id: organize
      run: |
        cd openwrt
        mkdir -p ../artifact
        rm -rf $(find . -type d -name "packages")
        # 搜集所有生成的固件及打包压缩包，确保 factory 和 sysupgrade 都能被收集到
        find bin/targets/ -type f \( -name "*.bin" -o -name "*.tar.gz" -o -name "*.img" \) -exec cp {} ../artifact/ \;

    - name: Upload Firmware to Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_XG-040G-MD_AntiBrick_StableWAN6
        path: artifact/*
